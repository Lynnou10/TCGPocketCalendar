<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><title>TCG Pocket · Plan 15 jours</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(25px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}.top{position:sticky;top:0;z-index:5;background:#07111fee;backdrop-filter:blur(14px);padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid #263a56}.topin,main{max-width:1150px;margin:auto}.topin{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:20px;margin:0}.sub,.note{color:#9fb0c6;font-size:11px}.count{text-align:right;font-weight:800}.bar{height:5px;background:#1e293b;border-radius:9px;margin-top:5px;overflow:hidden}.fill{height:100%;background:#22c55e;width:0}.tools{display:flex;justify-content:space-between;align-items:center;margin:12px 2px}.reset{background:none;color:#9fb0c6;border:1px solid #263a56;border-radius:9px;padding:7px 9px}.day{background:#0f1b2d;border:1px solid #263a56;border-radius:16px;margin:0 0 14px;overflow:hidden}.day.today{border-color:#60a5fa}.day.complete{border-color:#22c55e}.dh{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-bottom:1px solid #263a56}.date{font-weight:800;text-transform:capitalize}.todaytag{color:#60a5fa;font-size:10px;margin-left:6px}.dp{font-size:12px;color:#9fb0c6;font-weight:800}.complete .dp{color:#22c55e}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px}.action{background:#132238;border:1px solid #263a56;border-radius:13px;overflow:hidden}.action.done{border-color:#22c55e;background:#123322}.act{width:100%;border:0;background:none;color:inherit;text-align:left;padding:8px;display:grid;grid-template-columns:88px 1fr;gap:9px;align-items:center;-webkit-tap-highlight-color:transparent}.pic{width:88px;aspect-ratio:.716;position:relative;overflow:hidden;border-radius:7px;background:#050b13}.pic img{width:100%;height:100%;object-fit:cover;display:block}.check{position:absolute;inset:0;background:#052e1688;display:grid;place-items:center;opacity:0}.done .check{opacity:1}.check b{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#22c55e;font-size:26px}.route{font-size:10px;color:#9fb0c6;font-weight:700}.route strong{color:#dbeafe}.verb{display:inline-block;margin-top:5px;padding:3px 6px;border-radius:10px;background:#1d4ed833;color:#bfdbfe;font-size:10px;font-weight:800}.name{font-size:14px;font-weight:800;margin-top:6px;line-height:1.15}.meta,.status{font-size:11px;color:#9fb0c6;margin-top:5px}.dia{color:#fbbf24}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#64748b;margin-right:5px}.done .status{color:#86efac}.done .dot{background:#22c55e}main{padding:0 10px}.foot{text-align:center;color:#9fb0c6;font-size:10px}
@media(max-width:900px){.actions{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){h1{font-size:17px}.sub{display:none}.actions{grid-template-columns:1fr}.day{margin-bottom:11px}.act{grid-template-columns:105px 1fr;min-height:155px}.pic{width:105px}.name{font-size:16px}.route,.verb,.meta,.status{font-size:12px}}@media(max-width:360px){.act{grid-template-columns:90px 1fr}.pic{width:90px}.name{font-size:14px}}
</style></head><body>
<header class="top"><div class="topin"><div><h1>TCG Pocket · Plan 15 jours</h1><div class="sub">3 → 17 octobre 2026 · touche une action pour la valider</div></div><div class="count"><span id="gc">0 / 60</span><div class="bar"><div class="fill" id="gb"></div></div></div></div></header>
<main><div class="tools"><div class="note">✓ Sauvegarde locale sur cet appareil</div><button class="reset" id="reset">Réinitialiser</button></div><div id="cal"></div><div class="foot">Les validations restent mémorisées dans Safari/Chrome via localStorage.</div></main>
<script>
const K='tcgpocket-plan-2026-10-v1';
const d3=[[250,'Fragilady'],[257,'Teal Mask Ogerpon'],[267,'Victini'],[290,'Glaviodo'],[306,'Okéoké'],[307,'Korillon'],[310,'Nymphali'],[311,'Trousselin'],[314,'Virevorreur'],[325,"Grotadmorv d'Alola"],[328,'Darkrai'],[331,'Zarude'],[335,'Galarian Perrserker'],[340,'Exagide'],[348,'Tranchodon']];
const d2s=[[263,'Feurisson'],[265,'Galifeu'],[274,'Carabaffe'],[286,'Arrozard'],[296,'Lainergie'],[299,'Iguolta'],[303,'Épine-de-Fer'],[320,'Géolithe'],[339,'Dimoclès'],[344,'Draco'],[347,'Incisache'],[349,'Draïeul'],[363,'Bleuseille'],[364,'Glace Veinarde'],[365,'Générateur Électrique']];
const d2b=[[401,'Plaine de Départ'],[399,'Rainbow Cave'],[394,"Arène de l'Antiquité"],[391,'Copieuse'],[388,'Pepper'],[387,'Skyla'],[384,'Lem'],[378,'Iris'],[377,'Cape Élégante'],[376,'Barrière Métallique'],[375,'Poncho Protecteur'],[374,'Capsule Énergie Booster Temps Futur'],[373,'Capsule Énergie Booster Temps Jadis'],[372,'Petit Ballon'],[371,'Œuf Chance']];
const pad=n=>String(n).padStart(3,'0'), img=n=>`./B4b/${pad(n)}.webp`;
const iso=i=>{let d=new Date(2026,9,3+i);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const label=i=>new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(new Date(2026,9,3+i));
const days=Array.from({length:15},(_,i)=>({date:iso(i),label:label(i),a:[
 {k:`${i}a`,f:'BROOKLYN',t:'MAIN',v:'Partage',r:3,id:d3[i][0],n:d3[i][1]},
 {k:`${i}b`,f:'BROOKLYN',t:'SECONDARY',v:'Partage',r:2,id:d2s[i][0],n:d2s[i][1]},
 {k:`${i}c`,f:'BROOKLYN',t:'MAIN',v:'Trade',r:2,id:d2b[i][0],n:d2b[i][1]},
 {k:`${i}d`,f:'SECONDARY',t:'MAIN',v:'Trade',r:2,id:d2s[i][0],n:d2s[i][1]}
]}));
let s={};try{s=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ah(a){let done=!!s[a.k];return `<article class="action ${done?'done':''}"><button class="act" data-k="${a.k}"><div class="pic"><img src="${img(a.id)}" alt="${esc(a.n)}" loading="lazy"><div class="check"><b>✓</b></div></div><div><div class="route"><strong>${a.f}</strong> → <strong>${a.t}</strong></div><span class="verb">${a.v}</span><div class="name">${esc(a.n)}</div><div class="meta">#${pad(a.id)} · <span class="dia">${'♦'.repeat(a.r)}</span></div><div class="status"><span class="dot"></span>${done?'Fait':'À faire'}</div></div></button></article>`}
function render(){let now=new Date(),ti=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;document.getElementById('cal').innerHTML=days.map((d,i)=>{let n=d.a.filter(a=>s[a.k]).length;return `<section class="day ${d.date===ti?'today':''} ${n===4?'complete':''}" id="day-${d.date}"><div class="dh"><div class="date">Jour ${i+1} · ${d.label}${d.date===ti?'<span class="todaytag">Aujourd’hui</span>':''}</div><div class="dp">${n===4?'✓ Terminé':n+' / 4'}</div></div><div class="actions">${d.a.map(ah).join('')}</div></section>`}).join('');document.querySelectorAll('.act').forEach(b=>b.onclick=()=>{s[b.dataset.k]=!s[b.dataset.k];localStorage.setItem(K,JSON.stringify(s));render()});let done=days.flatMap(d=>d.a).filter(a=>s[a.k]).length;gc.textContent=`${done} / 60`;gb.style.width=`${done/60*100}%`}
reset.onclick=()=>{if(confirm('Réinitialiser toutes les validations ?')){s={};localStorage.removeItem(K);render()}};render();
</script></body></html>
