let collections={}, days=[], done={}, repl={}, obtained=[], activeAction=null;
try{done=JSON.parse(localStorage.getItem(K_DONE)||'{}')||{}}catch(e){}
try{repl=JSON.parse(localStorage.getItem(K_REPL)||'{}')||{}}catch(e){}
try{obtained=JSON.parse(localStorage.getItem(K_GOT)||'[]')||[]}catch(e){}

const pad=n=>String(n).padStart(3,'0');
const img=n=>`./B4b/${pad(n)}.webp`;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const meta=id=>CATALOG.find(c=>c.id===Number(id));
const save=()=>{localStorage.setItem(K_DONE,JSON.stringify(done));localStorage.setItem(K_REPL,JSON.stringify(repl));localStorage.setItem(K_GOT,JSON.stringify(obtained))};

function parseCSV(text){
  const lines=text.replace(/\r/g,'').trim().split('\n').filter(Boolean);
  if(!lines.length)return [];
  const head=lines[0].split(',').map(x=>x.trim());
  return lines.slice(1).map(line=>{
    const vals=line.split(',');
    const o={};head.forEach((h,i)=>o[h]=(vals[i]??'').trim());
    return o;
  });
}
function mapCollection(rows){
  const m={};
  rows.filter(r=>String(r.set_id).toUpperCase()===SET_ID).forEach(r=>m[Number(r.card_id)]=Number(r.quantity)||0);
  return m;
}
async function loadCollections(){
  const out={};
  for(const [account,path] of Object.entries(FILES)){
    const res=await fetch(`${path}?v=${Date.now()}`,{cache:'no-store'});
    if(!res.ok)throw new Error(`${path} → HTTP ${res.status}`);
    out[account]=mapCollection(parseCSV(await res.text()));
  }
  return out;
}
function q(account,id){return collections[account]?.[id]||0}
function mainMissing(c){return q('MAIN',c.id)<=0&&!obtained.includes(c.id)}
function available(account,c){return q(account,c.id)>0}
function candidates(account,rarities,used){
  for(const r of rarities){
    const list=CATALOG.filter(c=>c.r===r&&mainMissing(c)&&available(account,c)&&!used.has(c.id)).sort((a,b)=>a.id-b.id);
    if(list.length)return list;
  }
  return [];
}
function dateFromISO(iso){const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d,12)}
function addDaysISO(iso,n){const d=dateFromISO(iso);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function labelISO(iso){return new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(dateFromISO(iso))}
function actionKey(date,slot,id){return `${date}-${slot}-${id}`}
function makeAction(date,slot,group,from,to,verb,c){
  return {k:actionKey(date,slot,c.id),g:`${date}-${group}`,slot,f:from,t:to,v:verb,r:c.r,id:c.id,n:c.n};
}
function generatePlan(){
  const used=new Set();
  const out=[];
  for(let i=0;i<PLAN_DAYS;i++){
    const date=addDaysISO(PLAN_START,i), a=[];
    // 1) Partage BROOKLYN -> MAIN : priorité 3♦, puis 2♦, puis 1♦.
    let c=candidates('BROOKLYN',[3,2,1],used)[0];
    if(c){a.push(makeAction(date,'a','a','BROOKLYN','MAIN','Partage',c));used.add(c.id)}
    // 2+4) Circuit BROOKLYN -> SECONDARY -> MAIN : priorité 2♦ puis 1♦.
    c=candidates('BROOKLYN',[2,1],used)[0];
    if(c){
      a.push(makeAction(date,'b','s','BROOKLYN','SECONDARY','Partage',c));
      a.push(makeAction(date,'d','s','SECONDARY','MAIN','Trade',c));
      used.add(c.id);
    }else{
      // Si SECONDARY possède déjà une carte manquante, il peut la trader directement.
      c=candidates('SECONDARY',[2,1],used)[0];
      if(c){a.push(makeAction(date,'d','d','SECONDARY','MAIN','Trade',c));used.add(c.id)}
    }
    // 3) Trade BROOKLYN -> MAIN : priorité 2♦ puis 1♦.
    c=candidates('BROOKLYN',[2,1],used)[0];
    if(c){a.push(makeAction(date,'c','c','BROOKLYN','MAIN','Trade',c));used.add(c.id)}
    out.push({date,label:labelISO(date),a});
  }
  return out;
}
function allActions(){return days.flatMap(d=>d.a)}
function cardFor(a){return repl[a.k]||repl[a.g]||{id:a.id,n:a.n,r:a.r}}
function usedIds(){return new Set(allActions().map(a=>cardFor(a).id))}
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function targetDay(){const t=todayISO();return days.find(d=>d.date>=t)||days[days.length-1]}

function actionHTML(a){
  const c=cardFor(a), isDone=!!done[a.k], kind=a.v.toLowerCase()==='trade'?'trade':'share';
  const changed=c.id!==a.id;
  return `<article class="action ${kind} ${isDone?'done':''}">
    <button class="act" data-k="${a.k}">
      <div class="pic"><img src="${img(c.id)}" alt="${esc(c.n)}" loading="lazy"><div class="check"><b>✓</b></div></div>
      <div><div class="route"><strong>${a.f}</strong> → <strong>${a.t}</strong></div><span class="verb">${a.v}</span>
      <div class="name">${esc(c.n)}</div><div class="meta">#${pad(c.id)} · <span class="dia">${'♦'.repeat(c.r)}</span>${changed?' · remplacement':''}</div>
      <div class="status"><span class="dot"></span>${isDone?'Fait':'À faire'}</div></div>
    </button>
    <button class="already" data-got="${a.k}" ${isDone?'disabled':''}>Je l’ai déjà obtenue autrement</button>
  </article>`;
}
function renderCalendar(){
  const t=todayISO();
  cal.innerHTML=days.map((d,i)=>{
    const n=d.a.filter(a=>done[a.k]).length, total=d.a.length;
    const complete=total>0&&n===total;
    return `<section class="day ${d.date===t?'today':''} ${complete?'complete':''}" id="day-${d.date}">
      <div class="dh"><div class="date">Jour ${i+1} · ${d.label}${d.date===t?'<span class="todaytag">Aujourd’hui</span>':''}</div>
      <div class="dp">${total===0?'Aucune action':complete?'✓ Terminé':`${n} / ${total}`}</div></div>
      ${total?`<div class="actions">${d.a.map(actionHTML).join('')}</div>`:`<div class="emptyDay">Aucune carte transférable restante avec les collections actuelles.</div>`}
    </section>`;
  }).join('');
  cal.querySelectorAll('.act').forEach(b=>b.onclick=()=>{done[b.dataset.k]=!done[b.dataset.k];save();renderCalendar()});
  cal.querySelectorAll('.already').forEach(b=>b.onclick=e=>{e.stopPropagation();openReplace(b.dataset.got)});
  const acts=allActions(), n=acts.filter(a=>done[a.k]).length;
  gc.textContent=`${n} / ${acts.length}`;
  gb.style.width=acts.length?`${n/acts.length*100}%`:'0%';
}
function replacementOptions(a){
  const current=cardFor(a), used=usedIds(), got=new Set(obtained);
  used.delete(current.id);
  const rarities=current.r===3?[3,2,1]:current.r===2?[2,1]:[1];
  const isChain=a.g.endsWith('-s');
  const source=isChain?'BROOKLYN':a.f;
  for(const r of rarities){
    const opts=CATALOG.filter(c=>c.r===r&&mainMissing(c)&&available(source,c)&&!used.has(c.id)&&!got.has(c.id)).sort((x,y)=>x.id-y.id);
    if(opts.length)return {opts,r,source,fallback:r!==current.r};
  }
  return {opts:[],r:null,source,fallback:false};
}
function openReplace(k){
  activeAction=allActions().find(a=>a.k===k);if(!activeAction)return;
  const current=cardFor(activeAction), result=replacementOptions(activeAction);
  modalText.innerHTML=`Tu as déjà <strong>${esc(current.n)} #${pad(current.id)}</strong>. ${result.opts.length?`Choisis une carte disponible sur <strong>${result.source}</strong>${result.fallback?' dans la rareté inférieure disponible':''}.`:'Aucune autre carte compatible n’est disponible dans les collections chargées.'}`;
  choices.innerHTML=result.opts.length?result.opts.map(c=>`<button class="choice" data-id="${c.id}">
    <img src="${img(c.id)}" alt="${esc(c.n)}"><div class="choicename">${esc(c.n)}</div>
    <div class="choicemeta">#${pad(c.id)} · ${'♦'.repeat(c.r)}</div><div class="choiceSource">Disponible sur ${result.source}</div></button>`).join(''):`<div class="emptyDay">Aucun remplacement disponible.</div>`;
  choices.querySelectorAll('.choice').forEach(b=>b.onclick=()=>chooseReplacement(Number(b.dataset.id)));
  modal.classList.add('open');
}
function chooseReplacement(id){
  if(!activeAction)return;
  const c=meta(id);if(!c)return;
  const old=cardFor(activeAction);obtained=[...new Set([...obtained,old.id])];
  if(activeAction.g.endsWith('-s')){
    repl[activeAction.g]={id:c.id,n:c.n,r:c.r};
    allActions().filter(a=>a.g===activeAction.g).forEach(a=>done[a.k]=false);
  }else{
    repl[activeAction.k]={id:c.id,n:c.n,r:c.r};
    done[activeAction.k]=false;
  }
  save();closeReplace();renderCalendar();
}
function closeReplace(){modal.classList.remove('open');activeAction=null}

function renderStatus(){
  const missing=CATALOG.filter(mainMissing);
  const transf=missing.filter(c=>available('BROOKLYN',c)||available('SECONDARY',c));
  const nowhere=missing.filter(c=>!available('BROOKLYN',c)&&!available('SECONDARY',c));
  const b=missing.filter(c=>available('BROOKLYN',c)).length;
  const s=missing.filter(c=>available('SECONDARY',c)).length;
  statusSummary.innerHTML=`<h2>État calculé depuis les CSV</h2>
    <p><span class="fileok">✓</span> ${FILES.MAIN}<br><span class="fileok">✓</span> ${FILES.SECONDARY}<br><span class="fileok">✓</span> ${FILES.BROOKLYN}</p>
    <div class="statGrid"><div class="stat"><b>${missing.length}</b><span>manquent à MAIN</span></div><div class="stat"><b>${transf.length}</b><span>transférables</span></div><div class="stat"><b>${nowhere.length}</b><span>absentes partout</span></div></div>`;
  statusList.innerHTML=[3,2,1].map(r=>{
    const list=missing.filter(c=>c.r===r);
    if(!list.length)return '';
    return `<section class="raritySection"><div class="rarityTitle">${'♦'.repeat(r)} · ${list.length} manquante${list.length>1?'s':''}</div><div class="inventoryGrid">${list.map(c=>{
      const hb=available('BROOKLYN',c), hs=available('SECONDARY',c);
      return `<article class="ownCard ${hb||hs?'available':'none'}"><img src="${img(c.id)}" alt="${esc(c.n)}" loading="lazy"><div class="ownName">${esc(c.n)}</div><div class="ownMeta">#${pad(c.id)} · ${'♦'.repeat(c.r)}</div>
      ${hb?'<span class="badge b">BROOKLYN</span>':''}${hs?'<span class="badge s">SECONDARY</span>':''}${!hb&&!hs?'<span class="badge none">ABSENTE</span>':''}</article>`;
    }).join('')}</div></section>`;
  }).join('');
}
function showPage(page){
  const isCal=page==='calendar';
  calendarPage.classList.toggle('active',isCal);statusPage.classList.toggle('active',!isCal);
  tabCalendar.classList.toggle('active',isCal);tabStatus.classList.toggle('active',!isCal);
  if(!isCal)renderStatus();
}
function scrollToTarget(){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const target=targetDay(), el=target&&document.getElementById(`day-${target.date}`);
    if(el&&cal)cal.scrollTo({top:el.offsetTop-cal.offsetTop,behavior:'auto'});
  }));
}
async function init(){
  try{
    collections=await loadCollections();
    days=generatePlan();
    subtitle.textContent=`${labelISO(PLAN_START)} → ${labelISO(addDaysISO(PLAN_START,PLAN_DAYS-1))} · calculé depuis les 3 CSV`;
    renderCalendar();renderStatus();scrollToTarget();
  }catch(e){
    calendarPage.innerHTML=`<div class="error"><strong>Impossible de charger les collections.</strong><br><br>${esc(e.message)}<br><br>Vérifie que les trois fichiers sont dans <strong>collection/</strong> à côté de index.html :<br>collection_main.csv<br>collection_secondary.csv<br>collection_brooklyn.csv</div>`;
    statusPage.innerHTML=calendarPage.innerHTML;
    subtitle.textContent='Erreur de chargement des CSV';
    console.error(e);
  }
}
tabCalendar.onclick=()=>showPage('calendar');
tabStatus.onclick=()=>showPage('status');
closeModal.onclick=closeReplace;modal.onclick=e=>{if(e.target===modal)closeReplace()};
reloadBtn.onclick=()=>location.reload();
resetBtn.onclick=()=>{if(confirm('Réinitialiser les validations et remplacements locaux ?')){done={};repl={};obtained=[];localStorage.removeItem(K_DONE);localStorage.removeItem(K_REPL);localStorage.removeItem(K_GOT);days=generatePlan();save();renderCalendar();scrollToTarget()}};
init();
